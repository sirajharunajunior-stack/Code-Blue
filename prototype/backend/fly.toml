app = "code-blue-crew-monitor-fda0a9f"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MONITOR_DB = "/data/monitor.db"
  AI_MODEL = "gemini-3.5-flash-lite"
  AI_CHAT_REQUESTS_PER_MINUTE = "10"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "monitor_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
